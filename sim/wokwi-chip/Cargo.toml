[package]
name = "lsm6dsv-wokwi-chip"
description = "Wokwi custom chip wrapping the lsm6dsv-sim behavioral model"
version = "0.1.0"
license = "EUPL-1.2 OR MIT OR Apache-2.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lsm6dsv-registers = { path = "../../lsm6dsv-registers" }
lsm6dsv-sim = { path = "../../lsm6dsv-sim" }
wokwi_chip_ll = "0.2.0"

[profile.release]
opt-level = "s"
lto = true

[lints.clippy]
# Modules live in `name.rs` plus `name/`, never in `name/mod.rs`.
mod_module_files = "deny"
