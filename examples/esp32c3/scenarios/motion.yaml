name: Acceleration and angular rate
version: 1
author: Markus Mayer

steps:
  - wait-serial: 'LSM6DSV ok who_am_i=0x70'
  - wait-serial: 'accel x=0 y=0 z=0 mg gyro x=0 y=0 z=0 dps'
  - set-control:
      part-id: imu1
      control: accelZ
      value: 1000
  - wait-serial: 'accel x=0 y=0 z=1000 mg'
  - set-control:
      part-id: imu1
      control: gyroX
      value: -90
  - wait-serial: 'gyro x=-90 y=0 z=0 dps'
