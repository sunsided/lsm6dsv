# cargo-release configuration: run `cargo release` from the workspace root.
#
# Both publishable crates share one version and are released together with a single
# `vX.Y.Z` tag. CI publishes them (crates.io trusted publishing) and creates the GitHub
# Release when the tag is pushed (.github/workflows/release.yml), so release with:
#
#     cargo release X.Y.Z --execute --no-publish    # bump, stamp CHANGELOGs, commit, tag, push
#
# The very first version of each crate has to be published by hand (`cargo release X.Y.Z
# --execute`), because trusted publishing can only be configured for an existing crate.
allow-branch = ["main"]
shared-version = true
consolidate-commits = true
pre-release-commit-message = "Release {{version}}"
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
