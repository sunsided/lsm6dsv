[workspace]
resolver = "3"
members = ["lsm6dsv-registers", "lsm6dsv", "lsm6dsv-sim"]
exclude = ["sim/wokwi-chip", "examples"]

[workspace.package]
version = "0.3.1"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "EUPL-1.2 OR MIT OR Apache-2.0"
homepage = "https://github.com/sunsided/lsm6dsv"
repository = "https://github.com/sunsided/lsm6dsv"
edition = "2024"
rust-version = "1.85"

[workspace.lints.clippy]
# Modules with submodules use `name.rs` plus `name/`, never `name/mod.rs`.
mod_module_files = "deny"

[workspace.dependencies]
bitfield-struct = "0.13.0"
coordinate-frame = { version = "0.6.0", default-features = false }
defmt = "1.0.1"
embassy-futures = "0.1.2"
embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"
fake-bus = "0.1.0"
hardware-registers = "0.4.1"
lsm6dsv-registers = { path = "lsm6dsv-registers", version = "0.3.1" }
lsm6dsv-sim = { path = "lsm6dsv-sim" }
