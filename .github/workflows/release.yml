---
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          for crate in lsm6dsv lsm6dsv-registers; do
            printf "## %s\n" "$crate"
            # Print the section of this version, without its heading.
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$crate/CHANGELOG.md"
            echo
          done > release-notes.md
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$VERSION" --notes-file release-notes.md --verify-tag
