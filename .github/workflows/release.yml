---
name: Release

# Every `vX.Y.Z` tag (`cargo release X.Y.Z --execute --no-publish` creates and pushes one):
#
# 1. packages both crates and the Wokwi chip and attests their build provenance,
# 2. publishes lsm6dsv-registers, then lsm6dsv, to crates.io with trusted publishing (OIDC,
#    no stored token), skipping crate versions that are already there, and
# 3. creates the GitHub Release `X.Y.Z` with the version's CHANGELOG sections as notes and
#    the attested assets attached.
#
# Trusted publishing must be set up once per crate on crates.io (crate settings, Trusted
# Publishing): repository sunsided/lsm6dsv, workflow release.yml, environment crates-io.
# The very first version of a crate has to be published by hand.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

# Releases run one after another, never cancelled half-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and attest release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout only.
      id-token: write # Sign the provenance attestation.
      attestations: write # Store the provenance attestation.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the crate versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for crate in lsm6dsv-registers lsm6dsv; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            if [ "$tag" != "$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match $crate $version"
              exit 1
            fi
          done
      - name: Package crates
        run: cargo package -p lsm6dsv-registers -p lsm6dsv
      - name: Build Wokwi chip
        run: |
          rustup target add wasm32-unknown-unknown
          sim/wokwi-chip/build.sh
          # Wokwi's `github:` chip dependencies expect a chip.zip with chip.json and chip.wasm.
          mkdir -p dist/chip
          cp sim/wokwi-chip/lsm6dsv.chip.json dist/chip/chip.json
          cp sim/wokwi-chip/lsm6dsv.chip.wasm dist/chip/chip.wasm
          (cd dist/chip && zip -9 ../chip.zip chip.json chip.wasm)
          cp target/package/*.crate dist/
          ls -l dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/chip.zip
            dist/*.crate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: |
            dist/chip.zip
            dist/*.crate
          if-no-files-found: error

  publish:
    name: Publish to crates.io
    needs:
      - build
    runs-on: ubuntu-latest
    # The crates.io trusted publisher is bound to this environment.
    environment: crates-io
    permissions:
      contents: read # Checkout only.
      id-token: write # Exchange the OIDC token for a short-lived crates.io token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find crate versions to publish
        id: pending
        run: |
          version="${GITHUB_REF_NAME#v}"
          pending=""
          for crate in lsm6dsv-registers lsm6dsv; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "lsm6dsv release workflow (github.com/sunsided/lsm6dsv)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = "200" ]; then
              echo "::notice::$crate $version is already on crates.io; not publishing"
            else
              pending="$pending $crate"
            fi
          done
          echo "crates=${pending# }" >> "$GITHUB_OUTPUT"
      # Only authenticate when there is something to publish: a hand-published release
      # (such as the first one) needs no trusted publisher.
      - name: Authenticate with crates.io
        if: steps.pending.outputs.crates != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      # No build cache here on purpose: a release must not be built from a cache that a
      # pull request could have written.
      - name: Publish
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.pending.outputs.crates }}
        run: |
          # cargo publish waits until a crate is available, so lsm6dsv finds its dependency.
          for crate in $CRATES; do
            cargo publish -p "$crate"
          done

  github-release:
    name: Create GitHub Release
    needs:
      - build
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # `gh release create` writes to the repository.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in lsm6dsv lsm6dsv-registers; do
            printf "## %s\n" "$crate"
            # Print the section of this version, without its heading.
            awk -v heading="## [$version]" '
              index($0, heading) == 1 { found = 1; next }
              found && /^## \[/ { exit }
              found { print }
            ' "$crate/CHANGELOG.md"
            echo
          done > release-notes.md
          cat release-notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "${GITHUB_REF_NAME#v}" --notes-file release-notes.md --verify-tag --repo "$GITHUB_REPOSITORY" dist/*
