---
name: Rust

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  codespell:
    name: Check for spelling mistakes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Codespell
        uses: codespell-project/actions-codespell@v2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

  docs:
    name: Build documentation
    needs:
      - codespell
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  build-linux:
    name: Build on Linux
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [ [ ], [ "--all-features" ], [ "--no-default-features" ] ]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --workspace --verbose ${{ join(matrix.features, ' ') }}
      - name: Run doctests
        run: cargo test --workspace --doc --verbose ${{ join(matrix.features, ' ') }}
      - name: Run regular tests
        run: cargo test --workspace --tests --verbose ${{ join(matrix.features, ' ') }}
