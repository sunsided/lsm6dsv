---
name: Rust

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  codespell:
    name: Check for spelling mistakes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Codespell
        uses: codespell-project/actions-codespell@v2

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  docs:
    name: Build documentation
    needs:
      - codespell
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps

  build-linux:
    name: Build on Linux
    needs:
      - lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features: [ [ ], [ "--all-features" ], [ "--no-default-features" ] ]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --workspace --verbose ${{ join(matrix.features, ' ') }}
      - name: Run doctests
        run: cargo test --workspace --doc --verbose ${{ join(matrix.features, ' ') }}
      - name: Run regular tests
        run: cargo test --workspace --tests --verbose ${{ join(matrix.features, ' ') }}

  wokwi:
    name: Wokwi simulation (ESP32-C3)
    needs:
      - build-linux
    runs-on: ubuntu-latest
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, riscv32imc-unknown-none-elf
          components: clippy, rustfmt
      - name: Lint chip and firmware
        run: |
          (cd sim/wokwi-chip && cargo fmt --check && cargo clippy --release -- -D warnings)
          (cd examples/esp32c3 && cargo fmt --check && cargo clippy --release -- -D warnings)
      - name: Build chip
        run: sim/wokwi-chip/build.sh
      - name: Build firmware
        working-directory: examples/esp32c3
        run: cargo build --release
      - name: Run scenario
        if: env.WOKWI_CLI_TOKEN != ''
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: examples/esp32c3
          timeout: 30000
          scenario: scenarios/motion.yaml
